name: Keep Streamlit App Alive via Repository Updates
on:
  schedule:
    # Run every 10 hours (before the 12-hour sleep timeout)
    - cron: '0 */6 * * *'
  workflow_dispatch:  # Allows manual triggering

jobs:
  update_repo:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v3
        
      - name: Setup Git
        run: |
          git config --global user.name "GitHub Actions Bot"
          git config --global user.email "actions@github.com"
          
      - name: Update timestamp file
        run: |
          echo "Last updated: $(date)" > .streamlit_keepalive
          git add .streamlit_keepalive
          git commit -m "Update timestamp to keep app alive [skip ci]"
          git push
          
      - name: Wait for deployment to begin
        run: sleep 240  # Wait 4 minutes for GitHub to process the commit
      
      - name: Ping app to trigger deployment and verify status
        run: |
          echo "Pinging app to trigger deployment..."
          # First attempt - this may get a "building" response
          INITIAL_STATUS=$(curl -s -o /dev/null -w "%{http_code}" -L -H "User-Agent: Mozilla/5.0 (Windows NT 10.0; Win64; x64) AppleWebKit/537.36 (KHTML, like Gecko) Chrome/91.0.4472.124 Safari/537.36" https://genepath.streamlit.app)
          echo "Initial status after commit: $INITIAL_STATUS"
          
          # Wait for deployment to complete
          echo "Waiting for deployment to complete..."
          sleep 240  # Wait 4 minutes for deployment
          
          # Second attempt - should get the updated app
          FINAL_STATUS=$(curl -s -o /dev/null -w "%{http_code}" -L -H "User-Agent: Mozilla/5.0 (Windows NT 10.0; Win64; x64) AppleWebKit/537.36 (KHTML, like Gecko) Chrome/91.0.4472.124 Safari/537.36" https://genepath.streamlit.app)
          echo "Final status after deployment wait: $FINAL_STATUS"
          
          # If we're still not getting a success code, try waking the app
          if [[ $FINAL_STATUS != 2* ]]; then
            echo "App not responding with success code, attempting to wake it..."
            curl -s -L -H "User-Agent: Mozilla/5.0 (Windows NT 10.0; Win64; x64) AppleWebKit/537.36 (KHTML, like Gecko) Chrome/91.0.4472.124 Safari/537.36" -H "Accept: text/html,application/xhtml+xml,application/xml" -H "Accept-Language: en-US,en;q=0.9" -H "Connection: keep-alive" -H "Upgrade-Insecure-Requests: 1" https://genepath.streamlit.app?rerun=true
            
            # Wait for app to wake up
            echo "Waiting for app to wake up..."
            sleep 60
            
            # Final verification
            WAKE_STATUS=$(curl -s -o /dev/null -w "%{http_code}" -L https://genepath.streamlit.app)
            echo "Status after wake attempt: $WAKE_STATUS"
          fi
